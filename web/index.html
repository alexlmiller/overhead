      <aside class="flight-panel" aria-label="Current and recent aircraft">
        <section class="nearby-section">
          <div class="section-heading"><h1>Nearby now</h1><span id="nearby-count" class="count">0</span><span id="page-count" class="page-count" hidden></span></div>
          <div id="nearby-list" class="nearby-list"></div>
          <p class="empty" id="nearby-empty">Connecting to live data…</p>
          <a id="sign-in" class="sign-in" href="/" hidden>Sign in to Home Assistant</a>
        </section>
        <section class="recent-section">
          <div class="section-heading"><h2>Recently seen</h2><span class="eyebrow">LAST 5</span></div>
          <div id="recent-list" class="recent-list"></div>
          <p class="empty recent-empty" id="recent-empty">No recent sightings.</p>
        </section>
      </aside>
    </section>
    <footer class="footer"><span id="session-caption">LIVE AIRCRAFT</span><span>Positions <a href="https://adsb.fi" target="_blank" rel="noopener">adsb.fi</a><span class="source-divider">·</span>Routes <a href="https://www.adsb.lol" target="_blank" rel="noopener" title="Reported callsign routes; actual routes may differ.">ADSB.lol</a> / <a href="https://bozemanairport.com/flights" target="_blank" rel="noopener">BZN Airport</a> / <a href="https://www.flightaware.com" target="_blank" rel="noopener">FlightAware</a></span></footer>
  </main>
</body>
</html>
